<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    .container {
        width: 500px;
        height: 150vw;
        background-color: #adadad;
        border: 1px solid black;
        position: relative;
        left: 0px;
        top: 0px;
    }

    .box {
        width: 200px;
        height: 200px;
        border: 1px solid black;
        margin-bottom: 20px;
        position: absolute;
    }

    .box1 {
        background-color: red;
        left: 0;
        top: 0;
    }

    .box2 {
        background-color: green;
        left: 0;
        top: 220px;
        z-index: 3;
    }

    .box3 {
        background-color: blue;
        left: 0;
        top: 440px;
    }

    .box4 {
        width: 100vw;
        height: 20px;
        background-color: yellow;
        position: sticky;
        left: 0;
        top: 0;
    }

    .box5 {
        background-color: black;
        right: 0px;
        bottom: 20px;
        position: fixed;
    }
</style>

<body>
    <div class="container">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
    </div>

    <div class="box box4"></div>

    <div class="container">

        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
    </div>

    <div class="box box5"></div>

</body>

</html>
